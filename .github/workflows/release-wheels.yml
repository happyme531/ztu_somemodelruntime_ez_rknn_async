name: Build Wheels and Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write

jobs:
  build-wheels:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build Source Distribution
        run: python -m build --sdist --outdir dist

      - name: Build C++ Package (x86_64)
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="${PACKAGE_VERSION#v}"
          PACKAGE_NAME="ztu_somemodelruntime_rknn-${PACKAGE_VERSION}-linux-x86_64"
          mkdir -p release-assets
          docker run --rm --platform linux/amd64 \
            -e PACKAGE_NAME="${PACKAGE_NAME}" \
            -v "${PWD}:/project" \
            -w /project \
            ubuntu:22.04 \
            bash -euxc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                cmake g++ make
              cmake -S . -B /tmp/ztu-native-release-x86_64 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_LIBDIR=lib \
                -DBUILD_TESTING=OFF \
                -DZTU_SOMEMODELRUNTIME_RKNN_BUILD_PYTHON=OFF \
                -DZTU_SOMEMODELRUNTIME_RKNN_INSTALL_DEVEL=ON
              cmake --build /tmp/ztu-native-release-x86_64 --parallel
              cmake --install /tmp/ztu-native-release-x86_64 \
                --prefix "/tmp/${PACKAGE_NAME}"
              tar -C /tmp -czf "/project/release-assets/${PACKAGE_NAME}.tar.gz" \
                "${PACKAGE_NAME}"
            '

      - name: Build C++ Package (aarch64)
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="${PACKAGE_VERSION#v}"
          PACKAGE_NAME="ztu_somemodelruntime_rknn-${PACKAGE_VERSION}-linux-aarch64"
          mkdir -p release-assets
          docker run --rm --platform linux/arm64 \
            -e PACKAGE_NAME="${PACKAGE_NAME}" \
            -v "${PWD}:/project" \
            -w /project \
            ubuntu:22.04 \
            bash -euxc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                cmake g++ make
              cmake -S . -B /tmp/ztu-native-release-aarch64 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_LIBDIR=lib \
                -DBUILD_TESTING=OFF \
                -DZTU_SOMEMODELRUNTIME_RKNN_BUILD_PYTHON=OFF \
                -DZTU_SOMEMODELRUNTIME_RKNN_INSTALL_DEVEL=ON
              cmake --build /tmp/ztu-native-release-aarch64 --parallel
              cmake --install /tmp/ztu-native-release-aarch64 \
                --prefix "/tmp/${PACKAGE_NAME}"
              tar -C /tmp -czf "/project/release-assets/${PACKAGE_NAME}.tar.gz" \
                "${PACKAGE_NAME}"
            '

      - name: Build Wheels (Python 3.7-3.13)
        env:
          CIBW_ARCHS_LINUX: x86_64 aarch64
          CIBW_BUILD: cp37-* cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_CONFIG_SETTINGS: "cmake.build-type=Release"
        run: |
          python -m pip install --upgrade "cibuildwheel<3"
          python -m cibuildwheel --output-dir wheelhouse

      - name: Build Wheels (Python 3.14)
        env:
          CIBW_ARCHS_LINUX: x86_64 aarch64
          CIBW_BUILD: cp314-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_CONFIG_SETTINGS: "cmake.build-type=Release"
        run: |
          python -m pip install --upgrade "cibuildwheel>=3,<4"
          python -m cibuildwheel --output-dir wheelhouse

      - name: Collect Artifacts
        run: |
          mkdir -p dist
          cp -v wheelhouse/*.whl dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            release-assets/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
